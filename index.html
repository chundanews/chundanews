<script>
const firebaseConfig = {
    apiKey: 'AIzaSyBbfgRnpUo4BYquhX2sBAyok2WX3fsfnMM',
    authDomain: 'chunda-news.firebaseapp.com',
    projectId: 'chunda-news',
    storageBucket: 'chunda-news.firebasestorage.app',
    messagingSenderId: '872760222820',
    appId: '1:872760222820:web:5e316ef1eb27d5a7046b71',
    measurementId: 'G-N7CHP0LVYX'
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const ADMIN_UID = 'q9yvlsTLBtYgdii6QQjTeGkb4rv2';
let allNewsData = [], allJobAlerts = [], currentFilter = 'all', searchQuery = '', isAdminLoggedIn = false, currentActiveNewsId = null;

// --- Helper Functions ---
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(v,f=''){const r=String(v??'').trim();if(!r)return f;if(/^data:image\/(png|jpe?g|webp|gif);base64,/i.test(r))return r;try{const u=new URL(r,location.href);return ['http:','https:'].includes(u.protocol)?u.href:f}catch(_){return f}}

function requireAdmin(){
    if(isAdminLoggedIn && auth.currentUser && auth.currentUser.uid === ADMIN_UID) return true;
    alert('इस सुविधा के लिए एडमिन अधिकार आवश्यक हैं।');
    return false;
}

window.openPortalModal = id => {
    if(['post-modal','job-modal','admin-reports-modal'].includes(id) && !requireAdmin()) return;
    const e = document.getElementById(id);
    if(e) e.style.display = 'flex';
};

window.closePortalModal = id => {
    const e = document.getElementById(id);
    if(e) e.style.display = 'none';
};

window.toggleDarkMode = () => {
    document.documentElement.classList.toggle('dark');
};

// --- Real-time Data Listeners (यहीं से लोडिंग की समस्या ठीक होगी) ---
function initRealtimeNews() {
    db.collection('news_posts')
      .orderBy('createdAt', 'desc')
      .onSnapshot(snapshot => {
          allNewsData = [];
          snapshot.forEach(doc => {
              allNewsData.push({ id: doc.id, ...doc.data() });
          });
          renderNews();
          updateBreakingTicker();
      }, error => {
          console.error("Firestore News Error:", error);
          const container = document.getElementById('news-container');
          if (container) {
              container.innerHTML = `<div class="col-span-2 text-center py-8 text-red-500">समाचार लोड करने में त्रुटि आई। कृपया Firestore Security Rules जांचें।</div>`;
          }
      });
}

function initRealtimeJobs() {
    db.collection('job_alerts')
      .orderBy('createdAt', 'desc')
      .onSnapshot(snapshot => {
          allJobAlerts = [];
          snapshot.forEach(doc => {
              allJobAlerts.push({ id: doc.id, ...doc.data() });
          });
          renderJobs();
      }, error => {
          console.error("Firestore Jobs Error:", error);
      });
}

function updateBreakingTicker() {
    const breakingItems = allNewsData.filter(n => n.isBreaking);
    const ticker = document.getElementById('breaking-ticker');
    if (ticker) {
        if (breakingItems.length > 0) {
            ticker.innerText = breakingItems.map(n => n.title).join('  |  ');
        } else {
            ticker.innerText = 'चूंडा क्षेत्र न्यूज़ पर आपका स्वागत है - ताज़ा और निष्पक्ष खबरों के लिए जुड़े रहें...';
        }
    }
}

function renderJobs() {
    const list = document.getElementById('job-alerts-list');
    if (!list) return;
    if (!allJobAlerts.length) {
        list.innerHTML = '<p class="text-center text-xs text-gray-400">कोई नई भर्ती उपलब्ध नहीं है।</p>';
        return;
    }
    list.innerHTML = allJobAlerts.map(j => `
        <div class="border-b border-gray-100 dark:border-gray-800 py-2.5 last:border-0 text-xs">
            <h4 class="font-bold text-gray-900 dark:text-gray-100">${escapeHTML(j.title)}</h4>
            <p class="text-gray-500 text-[11px]">${escapeHTML(j.posts)}</p>
            <div class="flex justify-between items-center mt-1.5">
                <span class="text-red-600 text-[10px] font-semibold">अंतिम तिथि: ${escapeHTML(j.lastDate)}</span>
                <a href="${escapeHTML(safeUrl(j.link, '#'))}" target="_blank" class="bg-indigo-50 text-indigo-600 dark:bg-indigo-950 dark:text-indigo-300 px-2 py-0.5 rounded font-bold hover:underline">आवेदन करें</a>
            </div>
        </div>
    `).join('');
}

function renderNews() {
    const c = document.getElementById('news-container');
    if (!c) return;

    let a = currentFilter === 'all' ? allNewsData : allNewsData.filter(x => x.category === currentFilter);
    if (searchQuery) {
        a = a.filter(x => String(x.title || '').toLowerCase().includes(searchQuery) || String(x.content || '').toLowerCase().includes(searchQuery));
    }

    const countElem = document.getElementById('news-count');
    if (countElem) countElem.innerText = a.length + ' खबरें';

    if (!a.length) {
        c.innerHTML = '<div class="col-span-2 text-center py-8 text-gray-500">कोई खबर नहीं मिली।</div>';
        return;
    }

    c.innerHTML = a.map(n => {
        const id = escapeHTML(n.id);
        const img = safeUrl(n.images?.[0] || n.image, 'https://via.placeholder.com/600x400?text=Chunda+News');
        const reporter = escapeHTML(n.reporter || 'विशेष संवाददाता');
        const date = escapeHTML(n.date || '');
        const shortContent = escapeHTML((n.content || '').substring(0, 110) + (n.content && n.content.length > 110 ? '...' : ''));

        return `
        <article class="bg-white dark:bg-gray-900 rounded-lg shadow border border-gray-200 dark:border-gray-800 overflow-hidden flex flex-col justify-between">
            <div>
                <img src="${escapeHTML(img)}" class="h-44 w-full object-cover cursor-pointer hover:opacity-95 transition" onclick="openReadModal('${id}')" alt="${escapeHTML(n.title)}">
                <div class="p-4 pb-2">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[11px] bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300 px-2 py-0.5 rounded font-semibold">${escapeHTML(n.category || 'समाचार')}</span>
                        <span class="text-[11px] text-gray-400">${date}</span>
                    </div>
                    <h3 class="font-bold text-base text-gray-900 dark:text-gray-100 cursor-pointer hover:text-red-600 line-clamp-2" onclick="openReadModal('${id}')">${escapeHTML(n.title)}</h3>
                    <p class="text-xs text-gray-600 dark:text-gray-400 mt-2 line-clamp-2">${shortContent}</p>
                </div>
            </div>
            <div class="px-4 py-2 bg-gray-50 dark:bg-gray-800/50 border-t border-gray-100 dark:border-gray-800 flex justify-between items-center text-xs">
                <span class="text-gray-500 text-[11px]">✍️ ${reporter}</span>
                <div class="flex gap-2">
                    <button onclick="shareNewsWhatsApp('${id}')" class="text-emerald-600 font-bold hover:underline">शेयर</button>
                    <button onclick="openReadModal('${id}')" class="text-red-600 font-bold hover:underline">पढ़ें →</button>
                </div>
            </div>
        </article>`;
    }).join('');
}

window.filterNews = cat => {
    currentFilter = cat;
    const title = document.getElementById('current-category-title');
    if (title) title.innerText = cat === 'all' ? 'ताज़ा समाचार' : cat;
    renderNews();
};

window.handleLiveSearch = () => {
    const input = document.getElementById('search-input');
    searchQuery = input ? input.value.trim().toLowerCase() : '';
    renderNews();
};

// --- Read Modal ---
window.openReadModal = id => {
    const n = allNewsData.find(x => x.id === id);
    if (!n) return;
    currentActiveNewsId = id;
    document.getElementById('read-category').innerText = n.category || 'समाचार';
    document.getElementById('read-title').innerText = n.title;
    document.getElementById('read-reporter-name').innerText = n.reporter || 'विशेष संवाददाता';
    document.getElementById('read-date').innerText = n.date || '';
    document.getElementById('read-content').innerText = n.content;

    const gallery = document.getElementById('read-images-gallery');
    gallery.innerHTML = '';
    const imgs = n.images && n.images.length ? n.images : (n.image ? [n.image] : []);
    imgs.forEach(src => {
        const img = document.createElement('img');
        img.src = safeUrl(src);
        img.className = 'w-full rounded-lg mb-2 object-cover max-h-96';
        gallery.appendChild(img);
    });

    openPortalModal('read-modal');
};

window.closeReadModal = () => {
    currentActiveNewsId = null;
    closePortalModal('read-modal');
};

// --- Auth State & Initialization ---
auth.onAuthStateChanged(async user => {
    const bar = document.getElementById('admin-action-bar');
    const loginBtn = document.getElementById('admin-login-btn');
    if (user && user.uid === ADMIN_UID) {
        isAdminLoggedIn = true;
        if (bar) bar.style.display = 'flex';
        if (loginBtn) loginBtn.style.display = 'none';
        document.getElementById('admin-user-email').innerText = user.email;
    } else {
        isAdminLoggedIn = false;
        if (bar) bar.style.display = 'none';
        if (loginBtn) loginBtn.style.display = 'inline-block';
    }
});

// Admin Login/Logout
window.handleSecureAdminLogin = async e => {
    e.preventDefault();
    const em = document.getElementById('admin-email').value;
    const pw = document.getElementById('admin-password').value;
    try {
        await auth.signInWithEmailAndPassword(em, pw);
        closePortalModal('admin-modal');
        alert('एडमिन लॉगिन सफल!');
    } catch (err) {
        alert('लॉगिन त्रुटि: ' + err.message);
    }
};

window.logoutAdmin = async () => {
    await auth.signOut();
    alert('लॉगआउट हो गया।');
};

// Start listeners when DOM is loaded
window.addEventListener('DOMContentLoaded', () => {
    initRealtimeNews();
    initRealtimeJobs();
});
</script>
