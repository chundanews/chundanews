<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विस्तार से खबर - CHUNDA KSHETRA NEWS</title>
    <meta id="meta-description" name="description" content="CHUNDA KSHETRA NEWS की ताज़ा और विस्तृत खबर।">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <meta name="theme-color" content="#b91c1c">
    <link id="canonical-link" rel="canonical" href="https://chundanewslive.in/article.html">
    <meta id="og-title" property="og:title" content="CHUNDA KSHETRA NEWS">
    <meta id="og-description" property="og:description" content="CHUNDA KSHETRA NEWS की ताज़ा और विस्तृत खबर।">
    <meta id="og-url" property="og:url" content="https://chundanewslive.in/article.html">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="CHUNDA KSHETRA NEWS">
    <meta id="og-image" property="og:image" content="https://chundanewslive.in/icon-512.png">
    <meta property="og:locale" content="hi_IN">
    <meta id="twitter-title" name="twitter:title" content="CHUNDA KSHETRA NEWS">
    <meta id="twitter-description" name="twitter:description" content="CHUNDA KSHETRA NEWS की ताज़ा और विस्तृत खबर।">
    <meta id="twitter-image" name="twitter:image" content="https://chundanewslive.in/icon-512.png">
    <meta name="twitter:card" content="summary_large_image">
    <script id="article-schema" type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","publisher":{"@type":"NewsMediaOrganization","name":"CHUNDA KSHETRA NEWS","url":"https://chundanewslive.in/"},"inLanguage":"hi-IN"}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Mukta', sans-serif; }</style>
    
    <!-- Firebase SDKs & App Check -->
    <script src="https://www.google.com/recaptcha/enterprise.js?render=6LclU7AtAAAAANtGTXOZ3Ob0Z5uJmFS3pLMbrmD2"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-check-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js"></script>
</head>
<body class="bg-slate-100 dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">

    <header class="bg-red-700 text-white p-4 text-center shadow-md">
        <a href="/" class="text-2xl font-black tracking-tight">CHUNDA KSHETRA NEWS</a>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="article-container" class="bg-white dark:bg-gray-900 rounded-2xl p-6 shadow-md border dark:border-gray-800">
            <p id="loading-text" class="text-center text-gray-500 py-12">खबर लोड हो रही है...</p>
        </div>
        <div class="mt-6 text-center">
            <a href="/" class="bg-gray-800 text-white px-5 py-2 rounded-lg text-xs font-bold">← होमपेज पर लौटें</a>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBbfgRnpUo4BYquhX2sBAyok2WX3fsfnMM",
            authDomain: "chunda-news.firebaseapp.com",
            projectId: "chunda-news",
            storageBucket: "chunda-news.firebasestorage.app",
            messagingSenderId: "872760222820",
            appId: "1:872760222820:web:5e316ef1eb27d5a7046b71"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const RECAPTCHA_SITE_KEY = '6LclU7AtAAAAANtGTXOZ3Ob0Z5uJmFS3pLMbrmD2';
        try {
            const provider = new firebase.appCheck.ReCaptchaEnterpriseProvider(RECAPTCHA_SITE_KEY);
            firebase.appCheck().activate(provider, true);
        } catch (err) {
            console.warn("App Check Error:", err);
        }

        function sanitizeUrl(url) {
            if (!url) return '';
            const trimmed = String(url).trim();
            if (trimmed.startsWith('https://') || trimmed.startsWith('http://') || trimmed.startsWith('data:image/')) {
                return trimmed;
            }
            return '';
        }

        function sanitizeNewsHtml(html) {
            if (!html) return '';
            if (window.DOMPurify) {
                return DOMPurify.sanitize(String(html), {
                    ALLOWED_TAGS: ['p','br','strong','b','em','i','u','ul','ol','li','h2','h3','blockquote','a'],
                    ALLOWED_ATTR: ['href','target','rel'],
                    FORBID_ATTR: ['style','class','id','onclick','onerror','onload']
                });
            }
            return String(html);
        }

        function cleanText(value) {
            const temp = document.createElement('div');
            temp.innerHTML = String(value || '');
            return (temp.textContent || temp.innerText || '').replace(/\s+/g, ' ').trim();
        }

        function makeDescription(data) {
            const source = data.excerpt || data.summary || data.description || cleanText(data.content || '');
            const text = cleanText(source);
            if (text.length <= 160) return text || 'CHUNDA KSHETRA NEWS की ताज़ा और विस्तृत खबर।';
            return text.slice(0, 157).replace(/\s+\S*$/, '') + '...';
        }

        function setMeta(id, content) {
            const el = document.getElementById(id);
            if (el && content) el.setAttribute('content', content);
        }

        function setArticleSeo(data, id) {
            const title = cleanText(data.title || 'विस्तृत खबर');
            const description = makeDescription(data);
            const canonicalUrl = 'https://chundanewslive.in/article.html?id=' + encodeURIComponent(id);
            const imageUrl = sanitizeUrl((Array.isArray(data.images) && data.images.length) ? data.images[0] : data.image) || 'https://chundanewslive.in/icon-512.png';

            document.title = title + ' - CHUNDA KSHETRA NEWS';
            setMeta('meta-description', description);
            setMeta('og-title', title);
            setMeta('og-description', description);
            setMeta('og-url', canonicalUrl);
            setMeta('og-image', imageUrl);
            setMeta('twitter-title', title);
            setMeta('twitter-description', description);
            setMeta('twitter-image', imageUrl);

            const canonical = document.getElementById('canonical-link');
            if (canonical) canonical.setAttribute('href', canonicalUrl);

            const published = data.createdAt && typeof data.createdAt.toDate === 'function'
                ? data.createdAt.toDate().toISOString()
                : (data.publishedAt || data.datePublished || data.date || '');
            const modified = data.updatedAt && typeof data.updatedAt.toDate === 'function'
                ? data.updatedAt.toDate().toISOString()
                : (data.updatedAt || published);

            const schema = {
                '@context': 'https://schema.org',
                '@type': 'NewsArticle',
                headline: title,
                description: description,
                url: canonicalUrl,
                mainEntityOfPage: { '@type': 'WebPage', '@id': canonicalUrl },
                image: [imageUrl],
                inLanguage: 'hi-IN',
                publisher: {
                    '@type': 'NewsMediaOrganization',
                    name: 'CHUNDA KSHETRA NEWS',
                    url: 'https://chundanewslive.in/',
                    logo: { '@type': 'ImageObject', url: 'https://chundanewslive.in/icon-512.png' }
                }
            };

            if (published) {
                schema.datePublished = published;
                schema.dateCreated = published;
            }
            if (modified) schema.dateModified = modified;
            schema.author = data.reporter
                ? { '@type': 'Person', name: cleanText(data.reporter) }
                : { '@type': 'Organization', name: 'CHUNDA KSHETRA NEWS' };
            if (data.category) schema.articleSection = cleanText(data.category);

            const schemaEl = document.getElementById('article-schema');
            if (schemaEl) schemaEl.textContent = JSON.stringify(schema);
        }

        async function fetchArticle() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('article-container');

            if (!id) {
                container.innerHTML = '<p class="text-center text-red-500 py-8">अमान्य आर्टिकल लिंक।</p>';
                return;
            }

            try {
                const doc = await db.collection('news_posts').doc(id).get();
                if (!doc.exists) {
                    container.innerHTML = `<p class="text-center text-red-500 py-8">यह खबर या तो हटा दी गई है या उपलब्ध नहीं है。<br><small class="text-gray-400">ID: ${id}</small></p>`;
                    return;
                }

                const data = doc.data();
                document.title = (data.title || 'विस्तृत खबर') + " - CHUNDA KSHETRA NEWS";

                // Multiple Images handling for article page
                let imagesHtml = '';
                if (Array.isArray(data.images) && data.images.length > 0) {
                    imagesHtml = data.images.map(imgUrl => {
                        const safeImg = sanitizeUrl(imgUrl);
                        return safeImg ? `<img src="${safeImg}" class="w-full h-auto rounded-xl mb-4 object-cover max-h-[450px]" alt="${cleanText(data.title || "CHUNDA KSHETRA NEWS समाचार")}" loading="lazy" decoding="async" onerror="this.style.display='none'">` : '';
                    }).join('');
                } else if (data.image) {
                    const safeImg = sanitizeUrl(data.image);
                    imagesHtml = safeImg ? `<img src="${safeImg}" class="w-full h-auto rounded-xl mb-6 object-cover max-h-[450px]" alt="${cleanText(data.title || "CHUNDA KSHETRA NEWS समाचार")}" loading="eager" decoding="async">` : '';
                }

                container.innerHTML = `
                    <span class="bg-red-100 text-red-700 text-xs font-bold px-2.5 py-0.5 rounded">${data.category || 'सामान्य'}</span>
                    <h1 class="text-2xl md:text-3xl font-black mt-3 mb-2 leading-snug">${data.title || ''}</h1>
                    <p class="text-xs text-gray-500 mb-4">रिपोर्टर: ${data.reporter || 'विशेष संवाददाता'} | दिनांक: ${data.date || 'आज'}</p>
                    
                    ${imagesHtml}

                    <div class="text-sm leading-relaxed space-y-4 text-gray-700 dark:text-gray-300">
                        ${sanitizeNewsHtml(data.content || '')}
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<p class="text-center text-red-500 py-8">खबर लोड करने में नेटवर्क त्रुटि हुई।<br><small class="text-gray-400 font-mono">Error: ${err.message}</small></p>`;
            }
        }

        fetchArticle();
    </script>
</body>
</html>
