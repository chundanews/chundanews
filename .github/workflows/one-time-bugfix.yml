name: One-time index bug fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-bugfix.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Add shared escaping/URL helpers and session view guard.
          marker = "        let currentActiveNewsId = null;"
          insert = '''        let currentActiveNewsId = null;\n        const viewedNewsIds = new Set();\n\n        function escapeHTML(value) {\n            return String(value ?? '').replace(/[&<>\\\"']/g, ch => ({\n                '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', "'": '&#39;'\n            }[ch]));\n        }\n\n        function safeUrl(value, fallback = '') {\n            const raw = String(value ?? '').trim();\n            if (!raw) return fallback;\n            if (/^data:image\\/(png|jpe?g|webp|gif);base64,/i.test(raw)) return raw;\n            try {\n                const url = new URL(raw, window.location.href);\n                if (url.protocol === 'https:' || url.protocol === 'http:') return url.href;\n            } catch (_) {}\n            return fallback;\n        }'''
          if marker in s and 'const viewedNewsIds = new Set();' not in s:
              s = s.replace(marker, insert, 1)

          # 2) Preserve existing images when editing without selecting new files.
          old = "                if (manualUrl) imagesArray.push(manualUrl);\n\n                const postData = {"
          new = """                if (manualUrl) imagesArray.push(manualUrl);\n                if (editId && imagesArray.length === 0) {\n                    const existing = allNewsData.find(i => i.id === editId);\n                    const existingImages = existing?.images || (existing?.image ? [existing.image] : []);\n                    imagesArray = existingImages.filter(Boolean);\n                }\n\n                const postData = {"""
          s = s.replace(old, new, 1)

          # 3) Make breaking ticker safe against stored HTML/script payloads.
          s = re.sub(r'        function updateBreakingTicker\(\) \{.*?\n        \}\n\n        // Render News Cards', '''        function updateBreakingTicker() {\n            const ticker = document.getElementById('breaking-ticker');\n            const breakingItems = allNewsData.filter(i => i.isBreaking === true);\n            if (breakingItems.length > 0) {\n                ticker.innerHTML = breakingItems.map(item => `🔴 <span class="font-bold cursor-pointer hover:underline" onclick="openReadModal('${escapeHTML(item.id)}')">${escapeHTML(item.title)}</span>`).join('&nbsp;&nbsp;&nbsp;&nbsp;✦&nbsp;&nbsp;&nbsp;&nbsp;');\n            } else {\n                ticker.textContent = "चूंडा क्षेत्र न्यूज़ पर आपका स्वागत है - ताज़ा और निष्पक्ष खबरों के लिए जुड़े रहें...";\n            }\n        }\n\n        // Render News Cards''', s, count=1, flags=re.S)

          # 4) Replace news rendering with escaped output and safe image URLs.
          s = re.sub(r'        function renderNews\(\) \{.*?\n        \}\n\n        // Render Job Alerts', '''        function renderNews() {\n            const container = document.getElementById('news-container');\n            let filtered = currentFilter === 'all' ? allNewsData : allNewsData.filter(i => i.category === currentFilter);\n            if (searchQuery) {\n                filtered = filtered.filter(i => String(i.title || '').toLowerCase().includes(searchQuery) || String(i.content || '').toLowerCase().includes(searchQuery));\n            }\n\n            document.getElementById('news-count').innerText = `${filtered.length} खबरें`;\n            if (filtered.length === 0) {\n                container.innerHTML = `<div class="col-span-2 text-center py-8 text-gray-500">कोई खबर नहीं मिली।</div>`;\n                return;\n            }\n\n            container.innerHTML = filtered.map(item => {\n                const img = safeUrl(item.images?.length ? item.images[0] : item.image, 'https://via.placeholder.com/600x400?text=Chunda+News');\n                const multiImgBadge = (item.images && item.images.length > 1) ? `<span class="absolute bottom-2 right-2 bg-black/80 text-white text-[10px] px-2 py-0.5 rounded font-bold"><i class="fa-solid fa-images mr-1"></i>+${item.images.length}</span>` : '';\n                const viewsCount = Number(item.views) || 0;\n                const id = escapeHTML(item.id);\n                const adminControls = isAdminLoggedIn ? `\n                    <div class="flex gap-2 pt-2 border-t dark:border-gray-700 mt-2">\n                        <button type="button" onclick="editNewsPost('${id}')" class="text-xs bg-blue-600 text-white px-2.5 py-1 rounded font-bold cursor-pointer"><i class="fa-solid fa-pen-to-square"></i> एडिट</button>\n                        <button type="button" onclick="deleteNewsPost('${id}')" class="text-xs bg-red-600 text-white px-2.5 py-1 rounded font-bold cursor-pointer"><i class="fa-solid fa-trash"></i> डिलीट</button>\n                    </div>` : '';\n                return `\n                <div class="bg-white dark:bg-gray-900 rounded-lg shadow-sm border border-gray-200 dark:border-gray-800 overflow-hidden flex flex-col justify-between">\n                    <div>\n                        <div class="relative">\n                            <img src="${escapeHTML(img)}" alt="${escapeHTML(item.title)}" loading="lazy" class="h-44 w-full object-cover cursor-pointer" onclick="openReadModal('${id}')">\n                            ${multiImgBadge}\n                        </div>\n                        <div class="p-4">\n                            <div class="flex items-center justify-between gap-2 mb-2">\n                                <span class="bg-red-50 dark:bg-red-950 text-red-600 dark:text-red-400 font-bold px-2 py-0.5 rounded text-[10px]">${escapeHTML(item.category)}</span>\n                                <span class="text-gray-500 text-[10px] font-semibold">${escapeHTML(item.reporter || 'विशेष संवाददाता')}</span>\n                            </div>\n                            <h3 class="font-black text-gray-950 dark:text-white text-base hover:text-red-600 cursor-pointer" onclick="openReadModal('${id}')">${escapeHTML(item.title)}</h3>\n                            <p class="text-gray-600 dark:text-gray-400 text-xs mt-2 line-clamp-2">${escapeHTML(item.content)}</p>\n                        </div>\n                    </div>\n                    <div class="px-4 pb-4 pt-2 border-t dark:border-gray-800 flex flex-col">\n                        <div class="flex justify-between items-center w-full">\n                            <button type="button" onclick="openReadModal('${id}')" class="text-xs font-bold text-red-600 hover:underline cursor-pointer">पूरा पढ़ें &rarr;</button>\n                            <span class="text-[11px] font-bold text-gray-500 dark:text-gray-400"><i class="fa-solid fa-eye text-red-500 mr-1"></i>${viewsCount}</span>\n                            <div class="flex items-center gap-2">\n                                <button type="button" onclick="shareNewsWhatsApp('${id}')" class="text-green-600 hover:text-green-700 text-xs font-bold flex items-center gap-1 cursor-pointer" title="WhatsApp पर शेयर करें"><i class="fa-brands fa-whatsapp text-sm"></i> शेयर</button>\n                                <button type="button" onclick="copyNewsLink('${id}')" class="text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 text-xs cursor-pointer" title="लिंक कॉपी करें"><i class="fa-solid fa-link"></i></button>\n                            </div>\n                        </div>\n                        ${adminControls}\n                    </div>\n                </div>`;\n            }).join('');\n        }\n\n        // Render Job Alerts''', s, count=1, flags=re.S)

          # 5) Replace job rendering with escaped text and sanitized links.
          s = re.sub(r'        function renderJobAlerts\(\) \{.*?\n        \}\n\n        async function openReadModal', '''        function renderJobAlerts() {\n            const container = document.getElementById('job-alerts-list');\n            if (allJobAlerts.length === 0) {\n                container.innerHTML = '<p class="text-center text-xs text-gray-400 py-3">कोई सक्रिय फॉर्म नहीं है।</p>';\n                return;\n            }\n            container.innerHTML = allJobAlerts.map(job => {\n                const id = escapeHTML(job.id);\n                const title = escapeHTML(job.title);\n                const posts = escapeHTML(job.posts);\n                const lastDate = escapeHTML(job.lastDate);\n                const link = safeUrl(job.link, '#');\n                const waShareText = `📢 *सरकारी भर्ती / परीक्षा अलर्ट (Chunda News)*\\n\\n🎯 *${job.title || ''}*\\n📋 *विवरण:* ${job.posts || ''}\\n⏳ *अंतिम तिथि:* ${job.lastDate || ''}\\n🔗 *अप्लाई लिंक:* ${job.link || ''}`;\n                return `\n                <div class="bg-gray-50 dark:bg-gray-800/80 p-3 rounded-lg border border-indigo-100 dark:border-gray-800">\n                    <div class="flex justify-between items-start gap-2">\n                        <h4 class="font-bold text-xs text-gray-900 dark:text-gray-100 leading-snug flex-1">${title}</h4>\n                        <span class="bg-red-100 dark:bg-red-950 text-red-700 dark:text-red-400 text-[10px] font-black px-2 py-0.5 rounded shrink-0">अंतिम तिथि: ${lastDate}</span>\n                    </div>\n                    <p class="text-[11px] text-gray-600 dark:text-gray-400 mt-1">${posts}</p>\n                    <div class="mt-2.5 pt-2 border-t border-gray-200 dark:border-gray-700 flex justify-between items-center">\n                        <a href="${escapeHTML(link)}" target="_blank" rel="noopener noreferrer" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-bold px-2.5 py-1 rounded">अप्लाई करें</a>\n                        <div class="flex items-center gap-2">\n                            <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(waShareText)}" target="_blank" rel="noopener noreferrer" class="text-emerald-600 hover:text-emerald-700 text-xs font-semibold flex items-center gap-1"><i class="fa-brands fa-whatsapp"></i> शेयर</a>\n                            ${isAdminLoggedIn ? `<button type="button" onclick="deleteJobAlert('${id}')" class="text-red-600 text-xs font-bold cursor-pointer"><i class="fa-solid fa-trash"></i></button>` : ''}\n                        </div>\n                    </div>\n                </div>`;\n            }).join('');\n        }\n\n        async function openReadModal''', s, count=1, flags=re.S)

          # 6) Replace openReadModal with awaited, one-per-session view increment and safe gallery rendering.
          s = re.sub(r'        async function openReadModal\(id, updateHash = true\) \{.*?\n        \}\n\n        function closeReadModal', '''        async function openReadModal(id, updateHash = true) {\n            const item = allNewsData.find(i => i.id === id);\n            if (!item) return;\n            currentActiveNewsId = id;\n            if (updateHash && window.location.hash !== `#news-${id}`) history.pushState(null, null, `#news-${id}`);\n\n            if (!viewedNewsIds.has(id)) {\n                viewedNewsIds.add(id);\n                try {\n                    await db.collection("news_posts").doc(id).update({ views: firebase.firestore.FieldValue.increment(1) });\n                } catch (err) {\n                    viewedNewsIds.delete(id);\n                    console.log("Views increment error:", err);\n                }\n            }\n\n            const currentViews = (Number(item.views) || 0) + (viewedNewsIds.has(id) ? 1 : 0);\n            document.getElementById('read-views').innerHTML = `<i class="fa-solid fa-eye mr-1"></i> ${currentViews} Views`;\n            document.getElementById('read-title').innerText = item.title || '';\n            document.getElementById('read-category').innerText = item.category || '';\n            document.getElementById('read-reporter-name').innerText = item.reporter || 'विशेष संवाददाता';\n            document.getElementById('read-content').innerText = item.content || '';\n            document.getElementById('read-date').innerText = item.date || '';\n\n            const gallery = document.getElementById('read-images-gallery');\n            const imgs = (item.images || (item.image ? [item.image] : [])).map(src => safeUrl(src)).filter(Boolean);\n            if (imgs.length > 0) {\n                gallery.classList.remove('hidden');\n                gallery.innerHTML = imgs.map(src => `<img src="${escapeHTML(src)}" alt="${escapeHTML(item.title)}" loading="lazy" class="w-full h-56 object-cover rounded-lg border border-gray-200 dark:border-gray-700">`).join('');\n            } else {\n                gallery.classList.add('hidden');\n                gallery.innerHTML = '';\n            }\n            openPortalModal('read-modal');\n        }\n\n        function closeReadModal''', s, count=1, flags=re.S)

          # 7) Safe citizen-report rendering.
          s = re.sub(r'        async function loadCitizenReports\(\) \{.*?\n        \}\n\n        // Citizen Form Submit', '''        async function loadCitizenReports() {\n            const list = document.getElementById('admin-reports-list');\n            list.innerHTML = '<p class="text-center text-gray-400 py-4">लोड हो रहा है...</p>';\n            try {\n                const snapshot = await db.collection("citizen_reports").get();\n                if (snapshot.empty) {\n                    list.innerHTML = '<p class="text-center text-gray-400 py-4">कोई रिपोर्ट नहीं मिली।</p>';\n                    return;\n                }\n                list.innerHTML = snapshot.docs.map(doc => {\n                    const data = doc.data();\n                    return `\n                    <div class="bg-gray-50 dark:bg-gray-800 p-3 rounded-lg border dark:border-gray-700">\n                        <div class="flex justify-between font-bold text-gray-500 mb-1">\n                            <span>${escapeHTML(data.name || 'अज्ञात')} (📍 ${escapeHTML(data.location || '')})</span>\n                            <span>${escapeHTML(data.date || '')}</span>\n                        </div>\n                        <p class="text-gray-800 dark:text-gray-200 text-xs whitespace-pre-line">${escapeHTML(data.details || '')}</p>\n                    </div>`;\n                }).join('');\n            } catch (err) {\n                list.innerHTML = `<p class="text-red-500 text-center py-4">एरर: ${escapeHTML(err.message)}</p>`;\n            }\n        }\n\n        // Citizen Form Submit''', s, count=1, flags=re.S)

          # 8) Clipboard fallback + error handling.
          old_clip = '''        function copyNewsLink(newsId) {\n            const url = getSingleNewsLink(newsId);\n            navigator.clipboard.writeText(url).then(() => {\n                alert("खबर का लिंक कॉपी हो गया है!");\n            });\n        }'''
          new_clip = '''        async function copyTextFallback(text) {\n            try {\n                if (navigator.clipboard && window.isSecureContext) {\n                    await navigator.clipboard.writeText(text);\n                    return true;\n                }\n                const ta = document.createElement('textarea');\n                ta.value = text;\n                ta.style.position = 'fixed';\n                ta.style.opacity = '0';\n                document.body.appendChild(ta);\n                ta.focus();\n                ta.select();\n                const ok = document.execCommand('copy');\n                ta.remove();\n                return ok;\n            } catch (_) { return false; }\n        }\n\n        async function copyNewsLink(newsId) {\n            const url = getSingleNewsLink(newsId);\n            alert(await copyTextFallback(url) ? "खबर का लिंक कॉपी हो गया है!" : "लिंक कॉपी नहीं हो सका।");\n        }'''
          s = s.replace(old_clip, new_clip, 1)

          old_current = '''        function copyCurrentNewsLink() {\n            if (!currentActiveNewsId) return;\n            const url = getSingleNewsLink(currentActiveNewsId);\n            navigator.clipboard.writeText(url).then(() => {\n                const btnText = document.getElementById('copy-btn-text');\n                if (btnText) {\n                    btnText.innerText = "कॉपी हो गया! ✓";\n                    setTimeout(() => { btnText.innerText = "लिंक कॉपी"; }, 2000);\n                }\n            });\n        }'''
          new_current = '''        async function copyCurrentNewsLink() {\n            if (!currentActiveNewsId) return;\n            const url = getSingleNewsLink(currentActiveNewsId);\n            const ok = await copyTextFallback(url);\n            const btnText = document.getElementById('copy-btn-text');\n            if (btnText) {\n                btnText.innerText = ok ? "कॉपी हो गया! ✓" : "कॉपी असफल";\n                setTimeout(() => { btnText.innerText = "लिंक कॉपी"; }, 2000);\n            }\n        }'''
          s = s.replace(old_current, new_current, 1)

          # 9) Avoid NaN/Infinity in the scroll progress bar.
          s = re.sub(r"            const height = document\.documentElement\.scrollHeight - document\.documentElement\.clientHeight;\n            const scrolled = \(winScroll / height\) \* 100;", "            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;\n            const scrolled = height > 0 ? Math.min(100, Math.max(0, (winScroll / height) * 100)) : 0;", s, count=1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'const viewedNewsIds = new Set();' in s
          assert 'function escapeHTML(value)' in s
          assert 'async function copyTextFallback' in s
          assert 'safeUrl(item.images?.length ? item.images[0] : item.image' in s
          assert 'data.details ||' in s
          print('Bug-fix assertions passed.')
          PY

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/one-time-bugfix.yml
          git commit -m "fix: harden news rendering and improve client-side reliability"
          git push
