name: Generate sitemap

on:
  push:
    branches: [main, modern-ui-2026]
    paths:
      - 'generate-sitemap.js'
      - 'package.json'
      - 'package-lock.json'
      - 'sitemap.xml'
      - 'news-sitemap.xml'
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate sitemap
        run: node generate-sitemap.js

      - name: Commit sitemap when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- sitemap.xml news-sitemap.xml; then
            echo "Sitemap is already up to date."
            exit 0
          fi
          git add sitemap.xml news-sitemap.xml
          git commit -m "chore: refresh sitemap"
          git push origin HEAD:${GITHUB_REF_NAME}
